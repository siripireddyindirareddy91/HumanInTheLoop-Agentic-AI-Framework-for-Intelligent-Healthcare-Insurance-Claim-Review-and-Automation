services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: claimguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard"]
      interval: 5s
      retries: 10
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://claimguard:${POSTGRES_PASSWORD:-local-development-only}@database:5432/claimguard
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ClaimGuard!2026}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
